name: Feature request
description: Suggest an improvement to the iOS app
title: "Feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user need or workflow.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like the app to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and safety
      options:
        - label: I have not included passwords, bot tokens, channel keys, or personal information.
          required: true
